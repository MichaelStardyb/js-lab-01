name: CI & CD

on:
  push:
    branches: [ "**" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "**" ]

env:
  REGISTRY: ghcr.io

jobs:
  typecheck-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Run Typecheck
        run: npm run typecheck
      - name: Run Syntax Lint
        run: npm run lint
      - name: Run Unit, Chaos & Integration Tests
        run: npm test
      - name: Build Production Artifacts
        run: npm run build

  docker-and-deploy:
    needs: typecheck-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Compute short Git SHA
        id: vars
        run: echo "short_sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build Multi-Stage Production Docker Image
        run: |
          docker build \
            --build-arg GIT_SHA=${{ steps.vars.outputs.short_sha }} \
            -t dogfight:ci \
            .

      - name: Verify Image Size (< 200 MB) & Graceful SIGTERM via docker stop
        run: |
          SIZE_BYTES=$(docker image inspect dogfight:ci --format='{{.Size}}')
          SIZE_MB=$((SIZE_BYTES / 1024 / 1024))
          echo "Built image size: ${SIZE_MB} MB"
          test "${SIZE_MB}" -lt 200

          docker run -d --name dogfight-test -p 3000:3000 dogfight:ci
          for i in $(seq 1 15); do
            if curl -fsS http://127.0.0.1:3000/health | grep -q "${{ steps.vars.outputs.short_sha }}"; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:3000/health
          curl -fsS http://127.0.0.1:3000/ready
          curl -fsS http://127.0.0.1:3000/metrics | head -n 20

          START_STOP=$(date +%s)
          docker stop --time=10 dogfight-test
          STOP_ELAPSED=$(( $(date +%s) - START_STOP ))
          EXIT_CODE=$(docker inspect dogfight-test --format='{{.State.ExitCode}}')
          echo "docker stop completed in ${STOP_ELAPSED}s with exit code ${EXIT_CODE}"
          test "${EXIT_CODE}" -eq 0
          test "${STOP_ELAPSED}" -lt 10
          docker rm dogfight-test

      - name: Log in to GitHub Container Registry (GHCR)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Tagged Image to GHCR
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          IMAGE_URI="${REGISTRY}/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          docker tag dogfight:ci "${IMAGE_URI}:${TAG_NAME}"
          docker tag dogfight:ci "${IMAGE_URI}:${{ steps.vars.outputs.short_sha }}"
          docker tag dogfight:ci "${IMAGE_URI}:latest"
          docker push "${IMAGE_URI}:${TAG_NAME}"
          docker push "${IMAGE_URI}:${{ steps.vars.outputs.short_sha }}"
          docker push "${IMAGE_URI}:latest"

      - name: Deploy to Fly.io (if FLY_API_TOKEN is configured)
        if: startsWith(github.ref, 'refs/tags/v') && env.FLY_API_TOKEN != ''
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          curl -L https://fly.io/install.sh | sh
          export FLYCTL_INSTALL="/home/runner/.fly"
          export PATH="$FLYCTL_INSTALL/bin:$PATH"
          IMAGE_URI="${REGISTRY}/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]'):${GITHUB_REF#refs/tags/}"
          flyctl deploy --image "${IMAGE_URI}" --remote-only

      - name: Trigger Render Deploy Hook (if RENDER_DEPLOY_HOOK_URL is configured)
        if: startsWith(github.ref, 'refs/tags/v') && env.RENDER_DEPLOY_HOOK_URL != ''
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          curl -fsS -X POST "${RENDER_DEPLOY_HOOK_URL}"
